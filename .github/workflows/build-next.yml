name: Build Next Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-next-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-next:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push next image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pocket-id:next
            ghcr.io/${{ github.repository_owner }}/pocket-id:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Pocket ID
          cache-from: type=gha
          cache-to: type=gha,mode=max
